name: Release

on:
  push:
    tags: ["v*"]

jobs:
  test:
    if: github.repository == 'YP-Biotech/admet'
    runs-on: macos-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Run tests
        run: |
          uv sync --locked --extra control
          make test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Check the tag matches the package version
        run: |
          uv run --no-project --with packaging python - "${GITHUB_REF_NAME#v}" <<'PY'
          import sys, tomllib
          from packaging.version import Version
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          if Version(sys.argv[1]) != Version(version):
              sys.exit(f"tag v{sys.argv[1]} does not match the package version {version}")
          PY

      - name: Build package
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Re-running updates an existing release instead of failing.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            exit 0
          fi
          prerelease=""
          case "$GITHUB_REF_NAME" in *-alpha*|*-beta*|*-rc*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes \
            --title "ADMET ${GITHUB_REF_NAME#v}" $prerelease

  publish:
    # Trusted publishing: pypi.org must list this repository, release.yml and
    # the "pypi" environment as a publisher for the admet project.
    needs: github-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/admet/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true # a re-run publishes only what is missing
