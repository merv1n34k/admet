name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # The test suites are run on macOS during development; Qt and the Fluigent
    # simulator are not yet exercised on Linux runners.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12

      - name: Check the tag matches the package version
        run: |
          uv run --no-project --with packaging python - "${GITHUB_REF_NAME#v}" <<'PY'
          import sys, tomllib
          from packaging.version import Version
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          if Version(sys.argv[1]) != Version(version):
              sys.exit(f"tag v{sys.argv[1]} does not match the package version {version}")
          PY

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          uv sync --locked --extra control
          make test

      - name: Build
        run: uv build

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-alpha*|*-beta*|*-rc*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes \
            --title "ADMET ${GITHUB_REF_NAME#v}" $prerelease
