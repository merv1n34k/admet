[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "admet"
version = "0.1.0"
description = "Unified microfluidics acquisition and analysis workflow system"
requires-python = ">=3.12,<3.13"
# The core drives hardware and analyses data. It has no interface, so it pulls
# in no interface toolkit: a control machine installs neither Qt nor a web stack.
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
control = [
  "opencv-python>=4.10",
  "pypylon>=4.0",
  "setuptools<81",
]
analyze = [
  "cellpose>=3.0",
  "opencv-python>=4.10",
  "packaging",
  "scipy>=1.13",
  "torch>=2.3",
]
export = []
dev = [
  "ruff>=0.6",
]

[project.scripts]
admet = "admet.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/admet"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/admet/vendor/fgt_sdk/Python"]
